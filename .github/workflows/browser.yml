name: Concert Hall browser
on:
  pull_request:
jobs:
  workbench-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'jsonschema>=4.18' playwright
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 concert-hall/tests/e2e_workbench.py
        env:
          PHIL_SCREENSHOTS: browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser
          path: browser-artifacts
  official-dsh-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m pip install 'jsonschema>=4.18' playwright
      - run: python3 -m playwright install --with-deps chromium
      - name: Install pinned official DSH and its profile package manager
        run: npm install --prefix /tmp/phil-dsh-runtime --no-audit --no-fund @deepseek-ai/dsh@0.2.2-alpha.2 pnpm@11.28.5
      - name: Verify packed bundle in an actual official profile
        run: |
          export PATH="/tmp/phil-dsh-runtime/node_modules/.bin:$PATH"
          python3 dsh-plugin-philharmonie/tests/e2e_official.py
        env:
          DSH_BIN: /tmp/phil-dsh-runtime/node_modules/.bin/dsh
          PHIL_SCREENSHOTS: browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-dsh-browser
          path: browser-artifacts
