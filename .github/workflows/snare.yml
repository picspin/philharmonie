name: snare

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: install jsonschema
        run: python3 -m pip install --quiet "jsonschema>=4.18"
      - name: 0-token ladder
        run: |
          set -euo pipefail
          python3 -m unittest discover -s concert-hall/tests -v
          node concert-hall/tests/composer.test.mjs
          node concert-hall/tests/sound.test.mjs
          node dsh-plugin-philharmonie/tests/plugin.test.mjs
          node dsh-plugin-philharmonie/build.mjs --check
          npm --cache /tmp/philharmonie-npm-cache pack --ignore-scripts --dry-run
          node --check concert-hall/web/app.mjs
          bash scripts/test_compile_score.sh
          bash scripts/test_loop_runner.sh
          bash scripts/test_concert_hall.sh
          bash scripts/test_score_composer.sh
          bash scripts/test_audition_chair.sh
          bash scripts/test_garden_score.sh
          bash scripts/test_snare_score.sh
          bash scripts/test_spawn_chair.sh
          bash scripts/test_tacet_guard.sh
          bash scripts/test_halls.sh
          python3 scripts/garden_score.py
